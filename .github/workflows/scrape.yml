name: Daily Share Trading Scraper
on:
  schedule:
    - cron: "0 10 * * 1-5" # Run at 10:00 UTC, Monday to Friday
  workflow_dispatch:
jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Run scraper
        run: python daily_scraper.py

      - name: Commit and push if changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add daily_market_capitalization.csv daily_market_capitalization.json
          git commit -m "Update market capitalization data $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
